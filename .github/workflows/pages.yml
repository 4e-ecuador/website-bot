name: GitHub Pages

# Publish the reports only after CI has passed on master.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  APP_ENV: test
  DATABASE_URL: 'postgresql://app:password@127.0.0.1:5432/app?serverVersion=16&charset=utf8'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd="pg_isready -d app -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, gd, curl, dom, iconv, ctype, json, libxml
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          require-lock-file: true

      - name: Setup database
        run: |
          php bin/console doctrine:database:create
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:fixtures:load --no-interaction

      # The Panther browser tests need a ChromeDriver matching the runner's Chrome.
      - name: Install browser drivers
        run: vendor/bin/bdi detect drivers

      # UpdateBadgedataCommand shells out to ImageMagick. Ubuntu ships ImageMagick 6,
      # whose convert takes the same arguments as ImageMagick 7's magick for these calls.
      - name: Install ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq imagemagick
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick

      # The report steps never fail the build: CI already enforces them, these only collect the output.
      - name: Run PHPUnit with coverage
        env:
          PANTHER_NO_SANDBOX: 1
        run: |
          mkdir -p build/coverage
          php vendor/bin/phpunit --coverage-html build/coverage --coverage-text 2>&1 | tee build/phpunit-output.txt || true

      # phpstan.dist.neon reads the dev container XML from var/cache/dev.
      - name: Warm dev cache
        run: php bin/console cache:warmup --env=dev

      - name: Run PHPStan
        run: |
          php -d memory_limit=4G vendor/bin/phpstan analyse --error-format=json > build/phpstan-output.json 2>&1 || true

      - name: Run Rector (dry-run)
        run: |
          vendor/bin/rector process --dry-run > build/rector-output.txt 2>&1 || true

      - name: Generate Pages
        run: php .github/scripts/generate-pages.php

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
